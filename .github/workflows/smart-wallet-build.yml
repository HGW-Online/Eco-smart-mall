name: Smart wallet build
on:
  push:
    branches: ['claude/hgw-smart-wallet']
  pull_request:
    paths: ['smart-wallet/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-wallet
    env:
      VITE_PRIVY_APP_ID: cmvw5mrln007h0hldxdf3mps4
      VITE_ALCHEMY_API_KEY: build-check-placeholder
      VITE_ALCHEMY_POLICY_ID: b167bb59-2027-431c-a55a-41dfbd0a7da4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi 2>&1 | tee /tmp/install.log || { echo "::error::$(grep -i 'err' /tmp/install.log | head -20 | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(npm ls --depth=0 2>/dev/null | tr '\n' ' ')"
      - name: Unit tests
        run: npm test
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log || { echo "::error::$(grep -i -A4 'error' /tmp/build.log | head -20 | tr '\n' ' ')"; exit 1; }
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npx vite preview --port 5173 --strictPort &
          sleep 5
          node smoke.cjs http://localhost:5173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-wallet-lock
          path: smart-wallet/package-lock.json
