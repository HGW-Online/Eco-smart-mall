name: Smart wallet build
on:
  push:
    branches: ['claude/hgw-smart-wallet']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, test and build
        run: bash smart-wallet/ci.sh
