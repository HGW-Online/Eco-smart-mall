name: Mollie Sandbox Checks
on:
  push:
    branches: [feature/mollie-test-gateway]
  pull_request:
    paths:
      - 'integrations/mollie/**'
      - '.github/workflows/mollie-sandbox.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: integrations/mollie
      - run: npm test
        working-directory: integrations/mollie
