name: Unified Assets Checks
on:
  push:
    branches: [feature/unified-assets-demo]
  pull_request:
    paths:
      - 'demo/unified-assets.html'
      - 'tests/unified-assets.test.cjs'
      - '.github/workflows/unified-assets-checks.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify asset rights and transfer invariants
        run: node --test tests/unified-assets.test.cjs
