name: Identity Sandbox Tests
on:
  push:
    branches: [feature/signicat-sandbox-oidc]
  pull_request:
    paths:
      - 'integrations/signicat/**'
      - '.github/workflows/identity-sandbox.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: integrations/signicat
      - run: npm test
        working-directory: integrations/signicat
