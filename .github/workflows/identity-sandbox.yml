name: Identity Sandbox Tests
on:
  push:
    branches: [feature/signicat-sandbox-oidc]
  pull_request:
    paths:
      - 'integrations/signicat/**'
      - '.github/workflows/identity-sandbox.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: integrations/signicat
      - run: npm test
        working-directory: integrations/signicat
