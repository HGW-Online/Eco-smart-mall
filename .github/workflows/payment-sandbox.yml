name: Payment Sandbox Tests
on:
  push:
    branches: [feature/payment-gateway-test-backend]
  pull_request:
    paths: ['integrations/payments/**', '.github/workflows/payment-sandbox.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
        working-directory: integrations/payments
      - run: npm test
        working-directory: integrations/payments
