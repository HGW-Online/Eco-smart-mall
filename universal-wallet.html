<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HGW Universal Wallet</title><style>body{background:#091622;color:#e8f5f4;font:16px system-ui;margin:0}main{max-width:650px;margin:auto;padding:24px}section{background:#142837;padding:20px;border-radius:18px;margin:16px 0}input,select,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0;border-radius:10px;border:1px solid #567;background:#10212e;color:white;font:inherit}button{background:#007d70;cursor:pointer}a{color:#75e5c9}output{display:block;overflow-wrap:anywhere;white-space:pre-wrap}small{color:#b9ced8}</style><main><h1>HGW Universal Wallet</h1><p>Humanity Global Welfare · محفظة متابعة متعددة الشبكات</p><section><small>قراءة فقط — لا مفاتيح خاصة ولا تحويلات</small><label>عنوان المحفظة العام<input id="addr" dir="ltr" placeholder="0x..."></label><label>الشبكة<select id="net"></select></label><label>عنوان عقد ERC-20 (اختياري)<input id="token" dir="ltr" placeholder="0x..."></label><button id="check">فحص الرصيد</button><output id="result" aria-live="polite"></output><a id="explorer" target="_blank" rel="noopener noreferrer">فتح المستكشف</a></section><section><h2>Alchemy</h2><p>التطبيق المرتبط: HGW Universal Wallet</p><a href="https://dashboard.alchemy.com/apps/i9kwswlwpqef6x2w">إدارة التطبيق</a><p><small>هذه النسخة تستخدم RPC عامًا للقراءة؛ ربط Alchemy المباشر وحسابات Smart Wallet وPaymaster غير مفعلة.</small></p></section></main><script>const chains=[['Ethereum','https://ethereum-rpc.publicnode.com','https://etherscan.io','ETH'],['Base','https://mainnet.base.org','https://basescan.org','ETH'],['Gnosis','https://rpc.gnosischain.com','https://gnosisscan.io','xDAI'],['Celo','https://forno.celo.org','https://celoscan.io','CELO'],['Polygon','https://polygon-bor-rpc.publicnode.com','https://polygonscan.com','POL'],['Arbitrum','https://arb1.arbitrum.io/rpc','https://arbiscan.io','ETH'],['Optimism','https://mainnet.optimism.io','https://optimistic.etherscan.io','ETH'],['Base Sepolia (TEST)','https://sepolia.base.org','https://sepolia.basescan.org','ETH']];const $=id=>document.getElementById(id);chains.forEach((c,i)=>$('net').add(new Option(c[0],i)));const valid=x=>/^0x[0-9a-fA-F]{40}$/.test(x);function fmt(n,d){let s=BigInt(n).toString().padStart(d+1,'0');return d?s.slice(0,-d)+'.'+s.slice(-d).replace(/0+$/,'').padEnd(1,'0'):s}let seq=0;$('check').onclick=async()=>{let id=++seq,a=$('addr').value.trim(),t=$('token').value.trim(),c=chains[+$('net').value],o=$('result');if(!valid(a)||(t&&!valid(t))){o.textContent='عنوان غير صالح';return}$('explorer').href=c[2]+'/address/'+a;o.textContent='جارٍ الاستعلام…';async function rpc(method,params){let r=await fetch(c[1],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});let j=await r.json();if(!r.ok||j.error||!j.result)throw Error('RPC unavailable');return j.result}try{let b=await rpc('eth_getBalance',[a,'latest']);let s=c[0]+': '+fmt(b,18)+' '+c[3];if(t){try{let v=await rpc('eth_call',[{to:t,data:'0x70a08231'+a.slice(2).padStart(64,'0')},'latest']);let d=Number(BigInt(await rpc('eth_call',[{to:t,data:'0x313ce567'},'latest'])));if(d>255)throw Error();s+='\nERC-20: '+fmt(v,d)}catch{s+='\nتعذر قراءة التوكن؛ تحقق من العقد والشبكة'}}if(id===seq)o.textContent=s}catch{if(id===seq)o.textContent='تعذر الاتصال بالشبكة. جرب مرة أخرى أو افتح المستكشف.'}};</script></html>
