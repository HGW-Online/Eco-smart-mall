<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Smart Mall — Owner Demo</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17212c;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}header{background:#123c35;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
button,select{padding:9px 13px;border:1px solid #b9c8c6;border-radius:9px;background:white;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #4e9de0}
main{max-width:1100px;margin:auto;padding:20px}.stats,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:white;border-radius:12px;padding:17px;margin:10px 0;box-shadow:0 1px 5px #0001}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.active{background:#c9ebe3}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:start}
.scroll{overflow:auto}.tag{background:#f0f2f3;padding:4px 8px;border-radius:9px}small{color:#59656a}footer{padding:20px;text-align:center}
</style>
</head>
<body>
<header><div><strong>Eco Smart Mall</strong><div id="subtitle">لوحة المالك التجريبية</div></div><button id="lang">English</button></header>
<main><div class="card"><strong id="notice">بيانات تجريبية فقط — لا مدفوعات حقيقية ولا اتصال بـ Glide</strong></div>
<div class="stats" id="stats"></div><nav id="tabs" aria-label="Dashboard sections"></nav><section id="content"></section></main>
<footer>Demo only • Local in-memory data • No payments</footer><script src="app.js"></script>
</body></html>
